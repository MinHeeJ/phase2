services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sicost}
      POSTGRES_USER: ${POSTGRES_USER:-sicost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    image: sicost-backend:1.0.0
    pull_policy: build
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-sicost}
      DB_USER: ${POSTGRES_USER:-sicost}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  frontend:
    image: sicost-frontend:1.0.0
    pull_policy: build
    build:
      context: ../frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
