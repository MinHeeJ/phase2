services:
  db:
    image: postgres:16.8-alpine3.21
    environment:
      POSTGRES_DB: ${DB_NAME:-sicost}
      POSTGRES_USER: ${DB_USERNAME:-sicost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    image: sicost-backend:1.0.0
    pull_policy: build
    build:
      context: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-sicost}
      DB_USERNAME: ${DB_USERNAME:-sicost}
      DB_PASSWORD: ${DB_PASSWORD:-dev-only-password}
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  frontend:
    image: sicost-frontend:1.0.0
    pull_policy: build
    build:
      context: ../frontend
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres-data:
