services:
  db:
    image: postgres:16.6-alpine3.20
    environment:
      POSTGRES_DB: ${DB_NAME:-si_cost}
      POSTGRES_USER: ${DB_USERNAME:-si_cost}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
      TZ: Asia/Seoul
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    image: si-cost-backend:1.0.0
    build:
      context: ../backend
    pull_policy: build
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DB_NAME:-si_cost}
      DB_USERNAME: ${DB_USERNAME:-si_cost}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 6
  frontend:
    image: si-cost-frontend:1.0.0
    build:
      context: ../frontend
    pull_policy: build
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
