  scope_precedence: 기존 REQ-001~129와 그 회계·메타데이터는 이전 기반 범위 기록으로 그대로 보존한다. REQ-130~306 변경 범위에 대해서는 이 추가 계약이 엑셀/접근기록/업무 기능을 추가하며
    이전 범위의 제외 문구로 이번 기능을 제거하지 않는다.
  status: 설계 변경 패치만 생성. 정본 미수정·구현/실제 API 시험 미실행. parse·diff 재현·정본 불변 및 요구 회계 구조만 검증한다.
  wire_projection: 명시 API path/METHOD·upload 응답 필드는 원문 보존. 그 외 DTO·결과 필드명/PK 문자열은 승인 보류 설계 투영이며 물리 SQL 또는 사용자 승인으로 승격하지 않는다.
  authentication: SPEC-REQUEST.md:19·REQ-131에 로그인·권한 판정 없음이 명시되어 인증 없이 성공을 시험한다. UI-15 권한 키는 연결 자리이며 인증 실패 401/403을 만들지 않는다.
  export_conflict: SPEC-REQUEST.md:79·429·REQ-169/293의 전체 지급계좌 export를 유지한다. 474~475의 마스킹 답변은 추정·사용자 미확인으로 확정하지 않는다.
  retention: 원본 보관기간·삭제 스케줄·삭제 후 재검사/오류파일 응답은 미정. 30일 삭제는 승인되지 않았다.
  idempotency: 반영 token 반복 요청/통신 유실 재시도 반환은 미정. 같은 token 성공 결과 재반환을 보장하지 않는다.
  atomicity: DB 유일성 경합을 STALE_VALIDATION 409로 변환하고 업로드/업무/경고/변경/접근 기록 전체를 롤백한다. 키 사전 조회만으로 원자 경쟁 방지를 주장하지 않는다.
  baseline_limits: 기존 getHealth·관리 mutation의 불완전한 2XX 등은 immutable baseline으로 보존한다. 기존 검사 결함을 이번 패치에서 조용히 수정하거나 완료로 주장하지 않는다.
