      - 'auth: 인증 없이 허용 적용월의 기존 VAT_RATE 값을 저장 -> 로그인·권한 판정 없이 커밋되고 listParamVersions에서 그 적용월 값을 조회한다.'
      - 'validation: TARGET_UTIL_RATE의 허용 미래 적용월에 num_val=-1 또는 101을 각각 전송 -> 400·field=num_val·올바른 값을 입력하세요.이며 새 cmn.oprt_std
        행과 이력이 없다.'
      - 'business: 마지막 CLOSED=2026-09 상태에서 month=2026-09로 저장 -> 409 CLOSED_MONTH이고 해당 월과 과거 적용값·cmn.cd_hist 수가 그대로다.'
      - 'side-effect: VAT_RATE 2026-11=11 커밋 -> listCodeHistory group=PARAM에 dtl_cd=VAT_RATE·UPDATE·item_nm=적용 시작월·chg_user_id=NULL
        이력이 조회된다; 실제 값 전후 식별 상세는 OQ-004 승인 후 추가한다.'
      - 'persistence: VAT_RATE 동일 2026-11에 다른 허용 값을 다시 저장 -> 해당 복합키 행 수는 1이고 값만 갱신되며 2026-10 요청 유효값은 10으로 보존된다.'
      - 'validation: 문자형 기준값에 빈 문자열 또는 201자 txt_val 저장 -> 400·field=txt_val·올바른 값을 입력하세요.이며 해당 복합키와 이력은 미변경이다.'
      - 'boundary: 단위가 % 또는 %p인 기존 숫자형 기준값에 0과 100을 허용 적용월로 각각 저장 -> 저장된 num_val이 각 경계값으로 재조회된다.'
      x-open-questions:
