components:
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - true
        meta:
          type: object
          properties: {}
          description: 공통 메타 객체. 미정 업무 필드를 추가하지 않는다.
      required:
      - success
      - meta
      description: 성공 공통 봉투. 결과가 확정된 조회만 연산별 allOf에서 data를 구체화한다.
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        meta:
          type: object
          properties: {}
          description: 공통 메타 객체.
        code:
          type: string
          description: DUPLICATE_CODE·SYSTEM_CODE_LOCKED·CLOSED_MONTH는 원문 확정. 기타 code 문자열은 OQ-010.
