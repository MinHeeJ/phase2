          - DAY
          - HOUR
          nullable: true
        asgn_se_cd:
          type: string
          enum:
          - NEW
          - ADD
          - SUB
          - MOV
          - FREE
          default: NEW
        cntrct_dev_id:
          type: integer
          format: int64
          nullable: true
        ext_psblty_cd:
          type: string
