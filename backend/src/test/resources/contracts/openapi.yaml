x-developer-upload-change-scope:
  source: SPEC-REQUEST.md 전체401행; requirement-registry.json REQ-130~REQ-226 97행.
  baseline_preservation: 기존16 operations·모든 기존schema·ApiResponse/ApiError·security·REQ-001~129
    accounting은 무변경. 새 paths/schema/추적만 추가. 이 변경은①기반단계의 업로드제외를 이번 B.8/B.1 추가범위로만 확장한다.
  existing_reference_bindings:
  - operationId: getCodeOptions
    path: GET /api/codes/{group}
    usage: EMP_TYPE/WORK_TYPE/POSITION/GRADE/JOB/SKILL/WORK_STATUS/EXPENSE_ITEM 이름·옵션.
  - operationId: getEffectiveParam
    path: GET /api/params/{key}?month=YYYY-MM
    usage: VAT_RATE 해당월 값.
  - operationId: getMonthClose
    path: GET /api/month-close?from=YYYY-MM&to=YYYY-MM
    usage: 월마감 상태 및 급여 작업중월 표시. 가장이른월 탐색범위는 공통 계약 확인 필요.
  - operationId: createExcelMap
    path: POST /api/admin/excel-maps
    usage: 대응등록 재사용. 신규 API 명명원장으로 재등록하지 않는다.
  missing_reference: 기준선 paths에 /api/uploads·거래처/파트 options·③ FR-018/B.7 upload wire는
    없다. 실제품 코드도 없으므로 이를 확인된 existing operation으로 발명하지 않는다.
  schema_choices:
  - 기존 쓰기 DTO(CodeGroupCreate/CodeSaveRow/ExcelMapCreate)와 같은 snake_case 개발자저장·급여정규화.
    DEC-802 명시 options {id,mngNo,name,mainJob,empType}만 camelCase 보존.
  - 성공은 ApiResponse allOf+구체 data, 오류는 기존 ApiError 그대로. 새컬렉션은 data.items/total/page/size,
    단 options 원문배열은 data=[]·meta.total/page/size.
  - 원화 int64 HTTP투영, 계산금액 readOnly·x-sensitive, 입력 slry_amt만 원문확정0이상. 다른 급여/경비음수는
    OQ-CHG-003.
  - 파일은 DownloadArtifact(file_name/media_type/content_base64) JSON봉투를 미승인제안으로 투영.
    기존③ binary/header wire를 알 수 없어 OQ-UPLOAD-WIRE로 승인보류. 전송방식 확인후 이DTO 교체가능.
  - 'B.1/B.8 multipart oneOf: form_type·file 필수, B.1 month추가필수. upload_id·confirm·재검사ID·상태·파일전송DTO는
    전부 OQ-UPLOAD-WIRE 제안.'
  - 필수입력·경고·전체미반영·마감차단·전체교체·DB계산의 업무동작은 확정원문. 설계wire 미확인을 핑계로 이 동작을 선택사항으로 낮추지 않는다.
