          type: string
          minLength: 1
        rsn_desc:
          type: string
          nullable: true
          maxLength: 200
      required:
      - prj_id
      - dev_id
      - job_cd
      - bgn_dt
      - end_dt
      - asgn_rt
      - asgn_se_cd
      description: 'MO·DP 단가/기준 필수, TK NULL, SUB 계약상 인력 필수. 신규에는 비교 대상 updated_at
        없음. 과거·마감 기간에 걸친 신규 배정의 자동 START 기록에도 사유를 필수로 남긴다. 배정 폼과 B.5 업로드 양식에 사유 코드(rsn_cd,
        ASGN_CHG_RSN)와 사유 설명(rsn_desc, 선택·최대 200자) 입력을 추가하고 API·행 검증·양식 내려받기에 동일하게
        반영한다. 기존 업로드 출처 설명(엑셀 업로드 #{upldId})은 보존하며 사용자 사유를 대체하지 않는다. 사유 누락 시 필드/행
        오류로 안내하고 해당 배정·MM·단가·START 이력을 기록하지 않는다. 마감월 MM·단가 효과는 기존 확정값을 유지한다.'
