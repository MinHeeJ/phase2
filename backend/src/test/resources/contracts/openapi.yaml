openapi: 3.0.3
info:
  title: SI 프로젝트·원가 관리 기반 및 공통코드 HTTP 계약
  version: 기반-1
  description: SPEC-REQUEST.md 전체 352행과 승인 spec.md·plan.md·tasks.md·원장 129개의 설계 투영. 모든 API는 인증 없이 호출한다. 업무 동작은 원장 의미를 보존한다.
    원문 명시 METHOD/path는 유지하며 미지정 관리 자원 경로/operationId는 x-design-decision의 승인 보류 제안이다. OQ-001 영속성 충돌, OQ-002 SQL 부재, OQ-004
    이력 세부, OQ-005 봉투와 OQ-010 입력/성공 세부가 미해결이므로 build-ready가 아니다. 생성 완료는 구현·실행·사용자 승인이 아니다.
security: []
paths:
  /api/menus:
    get:
      operationId: getMenus
      summary: 활성 메뉴 트리
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-001
      - REQ-034
      - REQ-058
      - REQ-069
      - REQ-081
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MenuResponse'
        '500':
          description: 메뉴 조회 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-aiops-query-role:
        entity: sys.menu
        result_path:
        - data
      x-business-rules:
      - sys.menu.use_yn='Y'만 sort_seq 순으로 조회하여 upr_menu_id 2단 트리로 구성한다.
      x-pagination-exemption: REQ-081은 전체 활성 메뉴 트리 배열을 명시한다. 페이지로 잘라 자식 노드를 잃는 처리를 하지 않으며 검색 필터도 요구되지 않았다.
      x-open-questions:
      - 'OQ-005: 원문 트리 배열을 data 배열에 배치한 봉투의 승인 확인이 필요하다.'
      - 'OQ-API-01: getMenus는 현재 설계에서 부여한 operationId다.'
      x-contract-blockers:
      - 'OQ-010: 입력·인증이 없는 업무 메뉴 읽기에 원문이 정정 가능한 4xx 조건을 정의하지 않았다. 인프라 면제를 잘못 붙이거나 검사 통과용 오류를 발명하지 않는다. 사용자 확인 전 해당 4xx 완성
        조건은 미충족이다.'
      x-execution-model: 동기 Spring MVC 조회; DataScope=ALL. 작업 큐/202/폴링 없음.
      x-data-scope:
        schema:
          $ref: '#/components/schemas/DataScope'
        current: ALL
        description: 서비스 내부 인자. 호출자 권한 필터나 입력 파라미터가 아니며 sys.role을 읽지 않는다.
  /api/month-close:
    get:
      operationId: getMonthClose
      summary: 기간별 월마감
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-021
      - REQ-058
      - REQ-065
      - REQ-070
      - REQ-086
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/MonthCloseResponse'
        '400':
          description: from 또는 to가 YYYY-MM 형식이 아닌 입력 오류; field/message 제공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 월마감 조회 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: from
        in: query
        required: true
        description: from
        schema:
          $ref: '#/components/schemas/YearMonth'
      - name: to
        in: query
        required: true
        description: to
        schema:
          $ref: '#/components/schemas/YearMonth'
      x-aiops-query-role:
        entity: fin.mth_cls
        result_path:
        - data
      x-business-rules:
      - fin.mth_cls.cls_stts_cd로 CLOSED/OPEN을 판단하며 행 없는 달은 OPEN이다.
      - from/to는 YYYY-MM 형식이며 from>to의 구체 처리와 누락 월 합성 위치는 OQ-009다.
      x-pagination-exemption: REQ-086의 지정 from/to 기간 배열. from/to 자체가 범위 필터이며 별도 페이지 분할은 원문 미요구다.
      x-open-questions:
      - 'OQ-009: 누락 월 OPEN 응답 행 합성 여부와 from>to 처리 미정.'
      - 'OQ-005: 원문 월 배열은 현재 생성 계약에 따라 data 배열에 투영한다.'
      x-execution-model: 동기 Spring MVC 조회; DataScope=ALL. 작업 큐/202/폴링 없음.
      x-data-scope:
        schema:
          $ref: '#/components/schemas/DataScope'
        current: ALL
        description: 서비스 내부 인자. 호출자 권한 필터나 입력 파라미터가 아니며 sys.role을 읽지 않는다.
  /api/health:
    get:
      operationId: getHealth
      summary: 서비스 건강 확인
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-058
      - REQ-089
      responses:
        '200':
          description: 정상 기동 200. 본문 유무·필드는 원문 미정으로 이 문서에서 bodyless 또는 특정 JSON으로 확정하지 않는다.
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: 건강 확인 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-infrastructure-operation-reason: REQ-089 및 원문 완료 기준의 3서비스 healthy/GET /api/health 200 확인용이며 업무 테이블을 읽거나 변경하지 않는다.
      x-no-client-error-reason: 이 건강 확인 GET에는 path/query/body 입력과 인증·권한 판정이 없다. 호출자가 값을 정정할 4xx 조건이 원문에 없으며 정상 기동의 200만 확정이다.
      x-open-questions:
      - 'OQ-API-03/OQ-010: 건강 확인 본문·실패 상세 미정. JSON을 채택하면 ApiResponse를 참조해야 하며 빈 data를 완성 결과로 사용하지 않는다.'
      x-execution-model: 동기 Spring MVC 조회; DataScope=ALL. 작업 큐/202/폴링 없음.
  /api/codes/{group}:
    get:
      operationId: getCodeOptions
      summary: 사용 중 코드 선택 목록
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-036
      - REQ-037
      - REQ-058
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CodeOptionsResponse'
        '400':
          description: group 길이 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 코드 그룹 없음; 상세 code/message는 OQ-009
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 선택 코드 조회 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: group
        in: path
        required: true
        description: group
        schema:
          $ref: '#/components/schemas/GroupKey'
      x-aiops-query-role:
        entity: cmn.cd_dtl
        result_path:
        - data
      x-business-rules:
      - use_yn='Y'만 sort_seq 순으로 code/name/attr1/attr2/attr3를 반환한다.
      x-pagination-exemption: REQ-036·FR-003은 선택 옵션 전체 배열이다. 페이지 분할로 선택 후보를 누락하지 않는다. group 경로가 그룹 필터다.
      x-execution-model: 동기 Spring MVC 조회; DataScope=ALL. 작업 큐/202/폴링 없음.
      x-data-scope:
        schema:
          $ref: '#/components/schemas/DataScope'
        current: ALL
        description: 서비스 내부 인자. 호출자 권한 필터나 입력 파라미터가 아니며 sys.role을 읽지 않는다.
  /api/admin/code-groups:
    get:
      operationId: listCodeGroups
      summary: 코드 그룹 목록
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-034
      - REQ-058
      - REQ-059
      - REQ-060
      - REQ-100
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  required:
                  - data
                  properties:
                    data:
                      $ref: '#/components/schemas/CodeGroupsResponse'
        '400':
          description: size가 20/50/100이 아닌 입력 오류; page/sort 상세는 OQ-010
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 그룹 목록 조회 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: page
        in: query
        required: false
        description: 요청 페이지. 0/1 시작 기준은 OQ-010 확인 전 미정.
        schema:
          type: integer
      - name: size
        in: query
        required: false
        description: 서버 전체 기준 페이지 크기. 변경 이력 기본값 50, 나머지 기본값 미정.
        schema:
          type: integer
          enum:
          - 20
          - 50
          - 100
      - name: sort
        in: query
        required: false
        description: 기본 정렬 sort_seq 오름차순; 허용 추가 정렬 필드·문법은 OQ-010. 전체 집합에 적용한다.
        schema:
          type: string
      x-aiops-query-role:
        entity: cmn.cd_grp
        result_path:
        - data
        - items
      x-design-decision:
        status: 제안 — 승인 보류
        open_question: OQ-API-08
        reason: 업무 동작은 승인 요구에 존재하나 원문 미지정 HTTP 자원 이름/DTO 투영을 이 설계에서 배치했다. 사용자 확인 전 구현 인계하지 않는다.
      x-business-rules:
      - cmn.cd_grp 전체를 sort_seq 순으로 조회하며 BIZ 상세 코드 건수와 SYSTEM 구분을 반환한다.
      - 페이지를 사용하는 클라이언트는 전체 페이지를 수집해 원문 전체 그룹 목록을 구성하고 처음 첫 그룹을 선택한다.
      x-permission-keys:
      - UI-27.read
      x-execution-model: 동기 Spring MVC 조회; DataScope=ALL. 작업 큐/202/폴링 없음.
      x-data-scope:
        schema:
          $ref: '#/components/schemas/DataScope'
        current: ALL
        description: 서비스 내부 인자. 호출자 권한 필터나 입력 파라미터가 아니며 sys.role을 읽지 않는다.
    post:
      operationId: createCodeGroup
      summary: BIZ 코드 그룹 추가
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-031
      - REQ-033
      - REQ-040
      - REQ-060
      - REQ-110
      - REQ-111
      responses:
        2XX:
          description: 그룹 생성 커밋 성공. 구체 상태·성공 본문은 OQ-010.
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 그룹 코드/그룹명/추가 값 이름 입력 제약 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 그룹 생성 서버 오류
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeGroupCreate'
      x-permission-keys:
      - UI-27.create
      x-business-rules:
      - 'REQ-110: 그룹 코드 영문 대문자·_ 1~30자, 그룹명 1~100자, 추가 값 이름 각 50자 이하만 받는다.'
      - cd_grp_se_cd=BIZ와 맨 끝 sort_seq는 서버가 설정한다. use_yn 생성값과 그룹 중복 오류 정책은 OQ-010이며 추정하지 않는다.
      x-side-effects:
      - cmn.cd_grp에 BIZ·맨 끝 순서의 그룹을 INSERT한다.
      - 같은 트랜잭션으로 cmn.cd_hist ADD·dtl_cd=NULL 이력을 기록하며 chg_user_id는 NULL이다.
      x-required-tests:
      - 'happy: 길이·허용 문자에 맞는 신규 그룹을 생성 -> cmn.cd_grp에 BIZ·맨 끝 sort_seq가 생기고 listCodeGroups 전체 페이지에서 해당 그룹이 조회된다.'
      - 'auth: 인증 없이 그룹 생성 요청 -> 401/403 없이 성공하고 cmn.cd_grp의 새 행을 재조회한다; UI-27.create는 연결 자리만 사용한다.'
      - 'validation: 그룹명 빈 값으로 POST -> 400·field=cd_grp_nm과 message가 반환되고 cmn.cd_grp 행 수가 늘지 않는다.'
      - 'business: 생성 그룹 코드에 숫자를 넣어 POST -> 허용 문자 규칙 위반 400·field=cd_grp_id이며 그룹·ADD 이력 모두 생성되지 않는다.'
      - 'side-effect: 유효 BIZ 그룹 생성 뒤 listCodeHistory에서 해당 그룹 조회 -> ADD·dtl_cd=NULL·chg_user_id=NULL 이력이 반환된다.'
      x-open-questions:
      - 'OQ-010: 기존 그룹 중복에 대한 상태/code/message, use_yn 초기값, 성공 상태·결과 본문 미정. 별도 중복 그룹 정책을 만들지 않는다.'
      x-execution-model: 동기 Spring MVC → blocking 서비스 트랜잭션 → 커밋 후 응답. 실패 시 코드/해당 자원과 항목 이력을 함께 롤백한다. OQ-001 영속성 구현 선택 승인 전
        차단.
  /api/admin/code-groups/{group}/codes:
    get:
      operationId: listManagedCodes
      summary: 그룹 전체 관리 코드
      description: 인증 없이 호출한다. /api/admin 이름은 관리자 역할 검사를 뜻하지 않는다.
      security: []
      x-related-requirements:
      - REQ-034
      - REQ-038
      - REQ-058
      - REQ-059
      - REQ-061
      - REQ-102
      responses:
        '200':
          description: 조회 성공
          headers:
            X-Request-Id:
              description: 모든 응답의 문의 추적 번호 (REQ-058)
              schema:
                type: string
          content:
