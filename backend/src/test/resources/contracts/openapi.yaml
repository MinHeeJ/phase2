      - "auth: 실개인급여결합또는운영+시험설정의정형파일요청 -> 403·XLSX본문없음·파일생성0."
      - 'validation: 구조화intent불허/SQL필드/기간37개월/ID21개→400·모델/도구쓰기0.'
      - 'business: 독립가상매출100000000/원가80000000/+10%→XLSX88000000/12000000/12%,실DB개인민감결합403. 모델꺼짐도파일생성가능.'
      - "side-effect: 정형XLSX생성후DB재조회 -> qry_hist/대화/추천/공식예측/업무원천행수및내용동일·raw rows영속저장0."
      responses:
        '200':
          description: 비민감 내부용 XLSX. 재조회시점/원천/마감/가정 명시.
          headers:
            X-Request-Id:
              description: 기존공통 문의추적번호. ApiError.requestId와동일.
              schema:
                type: string
            Content-Disposition:
              description: attachment; filename*=UTF-8 인코딩된 .xlsx 파일명; 기존공통다운로드규약 사용.
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          description: '검증실패: 필수값·허용enum·YYYY-MM·길이·범위·allowlist 위반. ApiError.field로 수정위치 제공. 구체 미명시 code 문자열은 OQ-API-AI-02;
            임의오류코드를 원문확정으로 주장하지 않는다.'
          headers:
            X-Request-Id:
              description: 기존공통 문의추적번호. ApiError.requestId와동일.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 내부 개발/시험 범위 밖·타/만료 익명소유세션·민감 실제개인원가/급여 또는 역산결과 차단. 역할/로그인검사 새로 도입하지 않는다. 구체code는 OQ-API-AI-02.
          headers:
            X-Request-Id:
              description: 기존공통 문의추적번호. ApiError.requestId와동일.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 세션/대화/메시지/추천/개발자/전달원천 없음. 타세션은403 소유권거절. code wire는 OQ-API-AI-02.
          headers:
            X-Request-Id:
              description: 기존공통 문의추적번호. ApiError.requestId와동일.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 필수 선행서비스/DB 연결 장애. 모델만장애는200 MODEL_UNAVAILABLE 및정형폴백. 실제0/자료부재와구별; code wire OQ-API-AI-02.
          headers:
            X-Request-Id:
              description: 기존공통 문의추적번호. ApiError.requestId와동일.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-design-decision:
        status: 설계 투영 — 사용자 승인 및 실코드 조사 전
        reason: 명시 METHOD/path와 요구동작 보존. 공개 DTO 명칭/식별자타입/페이지 wire는 원문에서 완전확정되지 않았으며 fixture/문서검사로 승인대체하지 않는다. OQ-API-AI-01/02
          및 기존 OQ-001/002 유지.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiStructuredQuery'
      x-side-effects:
      - 비저장 읽기/계산만; 추천/공식예측/대화/평가/업무원천 쓰기0.
      x-state-transitions:
        business: 없음 — POST는검증된조건의읽기/계산전송일뿐업무상태전이아님.
      x-success-envelope-exemption: XLSX는실제binary첨부, JSON success/meta 봉투로감싸지않음. 오류만ApiError. SPEC-REQUEST.md:38,65.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DashboardMonth:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      minLength: 7
      maxLength: 7
      description: 월력상 유효한 YYYY-MM. Asia/Seoul 서버 Clock의 현재 월보다 미래이면 FUTURE_MONTH. 기존 YearMonth는 변경하지 않는다.
    DashboardNullableMonth:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
      minLength: 7
      maxLength: 7
      description: 마감 이력 없으면 null. 있으면 마지막 CLOSED 월.
      nullable: true
    DashboardCardError:
      type: object
      description: 카드 원천 실패 정보. 정상·미등록이면 null. 인증 거절을 새로 정의하지 않는다.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: 원천 또는 읽기 연결 실패 코드. 원천 코드 의미 보존.
        message:
          type: string
          description: 사용자에게 표시할 실제 실패 이유
      nullable: true
    DashboardCardState:
      type: object
      description: 공통 카드 상태. 실제 0은 READY, 결손은 MISSING, 원천 실패는 ERROR. PARTIAL은 정상 항목을 유지한다.
      required:
      - state
      - message
      - error
      properties:
        state:
          type: string
          enum:
          - READY
          - MISSING
          - ERROR
          - PARTIAL
          description: 카드 상태
        message:
          type: string
          description: 자료 없음·마감 자료 확인 필요·자료 부족 또는 원천 실패 안내. 정상은 null.
          nullable: true
        error:
          $ref: '#/components/schemas/DashboardCardError'
    DashboardWarning:
      type: object
      description: 부분 실패·원천 누락과 기준을 표시하는 경고. 필수 영역 실패는 전체 구현 완료가 아님.
      required:
      - section
      - code
      - message
      - basisMonth
      properties:
        section:
          type: string
          enum:
          - kpis
          - actions
          - closeProgress
          - projectAlerts
          - revenueCostTrend
          - workforceForecast
          - partSummary
          - pipeline
          - cashForecast
          description: 대상 영역
        code:
          type: string
          description: MISSING_CLOSED_SNAPSHOT 또는 원천의 결손·실패 코드
        message:
          type: string
          description: 구체 누락·실패 내용
        basisMonth:
          $ref: '#/components/schemas/DashboardNullableMonth'
    DashboardComparison:
      type: object
      description: 금액 전월 비교. 음수 전월은 참고 증감률, 전월 0·자료 없음은 비율 null.
      required:
      - previousAmount
      - changePercent
      - isReferenceRate
      - label
      properties:
        previousAmount:
          type: integer
          format: int64
          description: 직전 달 원 정수, 연도 경계 포함. 결손 null.
          nullable: true
        changePercent:
          type: number
          description: (M−M-1)/abs(M-1)×100. HALF_UP 소수 첫째. 계산 불가 null.
          nullable: true
        isReferenceRate:
          type: boolean
          description: 전월 손익이 음수인 경우 true
        label:
          type: string
          description: 전월 대비 또는 참고 증감률
    DashboardRevenueKpi:
      description: M월 확정 순공급가액, VAT 제외. IN=0, 수정청구/취소 반영. BillingRevenueQuery 재사용.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: M월 확정 순공급가액, VAT 제외. IN=0, 수정청구/취소 반영. BillingRevenueQuery 재사용.
        required:
        - basisMonth
        - amount
        - previous
        - targetAmount
        - achievementPercent
        properties:
          basisMonth:
            $ref: '#/components/schemas/DashboardMonth'
          amount:
            type: integer
            format: int64
            description: 월 매출 원 정수. 결손 null, 실제0은0.
            nullable: true
          previous:
            $ref: '#/components/schemas/DashboardComparison'
          targetAmount:
            type: integer
            format: int64
            description: 사업계획 M월 목표. 미등록 null.
            nullable: true
          achievementPercent:
            type: number
            description: 실적/목표×100. 목표0·미등록은 null.
            nullable: true
    DashboardProfitKpi:
      description: MonthlyProfitService의 M월 영업이익. VAT 제외, 영업외 전월 조정·중복 원가 차감 없음.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: MonthlyProfitService의 M월 영업이익. VAT 제외, 영업외 전월 조정·중복 원가 차감 없음.
        required:
        - basisMonth
        - amount
        - marginPercent
        - previous
        properties:
          basisMonth:
            $ref: '#/components/schemas/DashboardMonth'
          amount:
            type: integer
            format: int64
            description: 영업이익 원 정수. 결손 null.
            nullable: true
          marginPercent:
            type: number
            description: 매출0이면 null.
            nullable: true
          previous:
            $ref: '#/components/schemas/DashboardComparison'
    DashboardYtdProfitKpi:
      description: 선택 연도 1월~M월 영업이익. IMPORT/CLOSE 같은 달 이중 합산 금지.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: 선택 연도 1월~M월 영업이익. IMPORT/CLOSE 같은 달 이중 합산 금지.
        required:
        - fromMonth
        - toMonth
        - amount
        - targetAmount
        - achievementPercent
        - closedMonths
        - openMonths
        properties:
          fromMonth:
            $ref: '#/components/schemas/DashboardMonth'
          toMonth:
            $ref: '#/components/schemas/DashboardMonth'
          amount:
            type: integer
            format: int64
            description: 누계 영업이익 원 정수. 결손 null.
            nullable: true
          targetAmount:
            type: integer
            format: int64
            description: 동일 기간 사업계획 영업이익 목표 합. 미등록 null.
            nullable: true
          achievementPercent:
            type: number
            description: 목표0·미등록은 null.
            nullable: true
          closedMonths:
            type: array
            description: 확정값을 사용한 월
            items:
              $ref: '#/components/schemas/DashboardMonth'
          openMonths:
            type: array
            description: 원천 조회를 사용한 미마감 월
            items:
              $ref: '#/components/schemas/DashboardMonth'
    DashboardUtilizationKpi:
      description: UI-28과 같은 확정 투입 MM/근무 가능 직접 인력 MM. 중복·가배정 제외.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: UI-28과 같은 확정 투입 MM/근무 가능 직접 인력 MM. 중복·가배정 제외.
        required:
        - basisMonth
        - confirmedMm
        - availableMm
        - utilizationPercent
        - targetPercent
        - targetDifferencePp
        - idleDeveloperCount
        properties:
          basisMonth:
            $ref: '#/components/schemas/DashboardMonth'
          confirmedMm:
            type: number
            description: 확정 투입 MM 합. 결손 null.
            nullable: true
          availableMm:
            type: number
            description: 근무 가능 직접 인력 MM 합. 결손 null.
            nullable: true
          utilizationPercent:
            type: number
            description: 분모0이면 null.
            nullable: true
          targetPercent:
            type: number
            description: 기존 운영 기준, 없으면90. 결손과 실제0 구별.
            nullable: true
          targetDifferencePp:
            type: number
            description: 목표 대비 %p. 퍼센트 증감과 구별.
            nullable: true
          idleDeveloperCount:
            type: integer
            minimum: 0
            nullable: true
            description: 확정 투입0·휴직 아님·퇴사 제외 직접 인력 고유 인원. 결손 null.
    DashboardReceivableKpi:
      description: M이 아닌 오늘 현재 미수. VAT 포함, 유효 수정청구 상계, 음수 잔액 제외.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: M이 아닌 오늘 현재 미수. VAT 포함, 유효 수정청구 상계, 음수 잔액 제외.
        required:
        - basisDate
        - amount
        - overdueCount
        - overdueAmount
        properties:
          basisDate:
            type: string
            format: date
            description: asOf의 한국 오늘 날짜
          amount:
            type: integer
            format: int64
            description: 오늘까지 확정 청구 잔액 합 원 정수. 결손 null.
            nullable: true
          overdueCount:
            type: integer
            minimum: 0
            nullable: true
            description: 예정일<오늘·미수>0인 고유 청구 건수. 결손 null.
          overdueAmount:
            type: integer
            format: int64
            description: 동일 연체 판정 잔액 원 정수. 결손 null.
            nullable: true
    DashboardKpis:
      type: object
      description: 고정된 5개 KPI, 각각 독립 상태. 순서는 매출·월이익·누계이익·가동률·미수.
      required:
      - revenue
      - operatingProfit
      - ytdOperatingProfit
      - utilization
      - receivables
      properties:
        revenue:
          $ref: '#/components/schemas/DashboardRevenueKpi'
        operatingProfit:
          $ref: '#/components/schemas/DashboardProfitKpi'
        ytdOperatingProfit:
          $ref: '#/components/schemas/DashboardYtdProfitKpi'
        utilization:
          $ref: '#/components/schemas/DashboardUtilizationKpi'
        receivables:
          $ref: '#/components/schemas/DashboardReceivableKpi'
    DashboardAction:
      type: object
      description: CMN-1721 고정 순서의 종류별 1행. 유형 내부 원천키 중복 제거. 0건은 제외, 미조회는 UNDETERMINED/null.
      required:
      - type
      - severity
      - state
      - title
      - affectedCount
      - unit
      - description
      - sourceMonth
      - withoutNextAssignmentCount
      - recommendedDeveloperCount
      properties:
        type:
          type: string
          enum:
          - OVERDUE_RECEIVABLE
          - CASH_SHORTAGE
          - WORKFORCE_SHORTAGE
          - RISK_PROJECT
          - MM_EXCESS
          - UNCONTRACTED_ASSIGNMENT
          - WITHDRAWAL
          - UNASSIGNED_PART
          - OVERDUE_ISSUE
          - STALE_PROJECT_UPDATE
          - BILLING_GAP
          - PENDING_QUOTE_APPROVAL
          - UNCLOSED_PREVIOUS_MONTH
          - STALE_OPPORTUNITY
          - LOW_MARGIN
          - UNCONFIRMED_ADDITIONAL_CONTRACT
          description: CMN-1721 1~16 순서
        severity:
          type: string
          enum:
          - URGENT
          - CAUTION
          description: 앞4개 급함, 나머지 주의
        state:
          type: string
          enum:
          - READY
          - UNDETERMINED
          description: 정보 미조회는 판정 불가
        title:
          type: string
          description: 위험 종류 제목
        affectedCount:
          type: integer
          minimum: 0
          nullable: true
          description: 영향 대상 고유 건수·인원·월수. 미조회 null.
        unit:
          type: string
          enum:
          - CASE
          - PERSON
          - MONTH
          description: 건/명/개월
        description:
          type: string
          description: 설명·사용한 월·다음 배정 n명 중 추천 m명 문구
        sourceMonth:
          $ref: '#/components/schemas/DashboardNullableMonth'
        withoutNextAssignmentCount:
          type: integer
          minimum: 0
          nullable: true
          description: 철수 고유 개발자 n, 다른 유형 null.
        recommendedDeveloperCount:
          type: integer
          minimum: 0
          nullable: true
          description: n명 중 유효 규칙 기반 추천을 가진 m명. m≤n. 다른 유형 null.
    DashboardActions:
      description: 기준 없는 확인할 일은 오늘 현재. 저장·발송 없이 조회. 행 수와 영향 수를 구별.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: 기준 없는 확인할 일은 오늘 현재. 저장·발송 없이 조회. 행 수와 영향 수를 구별.
        required:
        - basisDate
        - totalKinds
        - urgentKinds
        - items
        properties:
          basisDate:
            type: string
            format: date
            description: 오늘 기준
          totalKinds:
            type: integer
            minimum: 0
            description: 표시된 종류 행 수
          urgentKinds:
            type: integer
            minimum: 0
            description: 급함 종류 행 수
          items:
            type: array
            description: 급함 먼저, 원문 고정 순서. 판정 불가도 누락하지 않는다.
            items:
              $ref: '#/components/schemas/DashboardAction'
            maxItems: 16
    DashboardCloseCheck:
      type: object
      description: 최신 CLOSE_CHECK 9종의 원천 항목. CLOSED는 확정 당시 이력, OPEN은 최신 저장 결과.
      required:
      - code
      - name
      - status
      - issueCount
      - description
      properties:
        code:
          type: string
          description: 원천 CLOSE_CHECK 코드. 새 점검 종류 생성 금지.
        name:
          type: string
          description: 점검 이름
        status:
          type: string
          enum:
          - OK
          - WARN
          - FAIL
          description: 원천 상태
        issueCount:
          type: integer
          minimum: 0
          description: issue_cnt
        description:
          type: string
          description: 미완료·경고·차단 설명
    DashboardCloseProgress:
      description: 기준월 M. GET에서 runClosingCheck/confirmClosing 금지. OPEN 미점검은 실패9개가 아님.
      allOf:
      - $ref: '#/components/schemas/DashboardCardState'
      - type: object
        description: 기준월 M. GET에서 runClosingCheck/confirmClosing 금지. OPEN 미점검은 실패9개가 아님.
