x-security-policy:
  related_requirements:
  - REQ-001
  - REQ-030
  - REQ-032
  - REQ-033
  - REQ-034
  - REQ-035
  description: 인증 방식은 이번 범위에 없다. security=[]와 빈 securitySchemes는 명시 비인증 계약이며 추정 정책 부재를 뜻하지 않는다. can=true·CurrentUser 고정·DataScope=ALL·현재
    무마스킹을 보존한다. 따라서 x-roles와 임의 401/403·로그인 API를 추가하지 않는다.
x-http-decisions:
  envelope: 현재 생성 계약에 의해 ApiResponse/ApiError success/meta를 필수화한다. 오류 code/message/field/requestId는 최상위 보존, 조회 배열·페이지는 data로
    투영한다. OQ-005의 사용자 승인 상태는 유지한다.
  pagination: 페이지 목록은 data.items/total/page/size. size는 20/50/100, 이력은 기본50. page 시작값·추가 필터·정렬 문법은 OQ-010. 원문 명시 전체 트리/선택
    배열/기간 배열은 operation의 x-pagination-exemption에 근거를 기록한다. 임의 필터를 추가하지 않는다.
  mutation_result: 원문 미정 쓰기 성공 HTTP 상태는 2XX 계열로 표시한다. 업무 data 결과는 미정으로 OQ-010에 두며 빈 data object를 완성된 결과로 반환하지 않는다. 명시 본문 없는
    204로 임의 바꾸지 않는다.
  downloads: REQ-002에 따라 실제 엑셀 업로드·다운로드·인쇄·파일 저장 연산은 없다. 엑셀 표기 대응은 JSON 자원이며 multipart/binary API로 바꾸지 않는다. 이 문장은
    REQ-002의 기반 단계 범위 설명으로 보존한다. 이번 변경 REQ-171/205~223은 개발자 목록 다운로드와 B.8/B.1 업로드·양식·오류파일을 추가하며 새 operation의 OQ-UPLOAD-WIRE
    제안을 따른다. 기존16 operation에는 소급 변경하지 않는다.
  health: getHealth 200의 본문은 미정이다. ApiResponse 참조 없는 임의 2xx JSON 본문을 추가하지 않는다. 명시 요구 REQ-089이므로 x-no-requirement-reason은 사용하지
    않는다.
