        rsn_desc:
          type: string
          nullable: true
          maxLength: 200
      description: 'B.5 원문 열 정규화 미리보기. 프로젝트 prj_no·관리번호로 조회; 유효하지 않은 행은 issues 근거.
        빈률1.00·빈구분NEW. 과거·마감 기간에 걸친 신규 배정의 자동 START 기록에도 사유를 필수로 남긴다. 배정 폼과 B.5 업로드
        양식에 사유 코드(rsn_cd, ASGN_CHG_RSN)와 사유 설명(rsn_desc, 선택·최대 200자) 입력을 추가하고 API·행
