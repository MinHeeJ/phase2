x-confirmed-assignment-decisions:
- id: OQ-ASGN-01
  decision: 교체된 기존 투입은 교체일 이전의 미마감 월별 MM 수정, 해당 기간의 단가 변경, 기록 정정만 허용합니다. 기간·투입 구분
    변경, 연장, 재교체, 배정 취소는 막고 교체 관계는 유지합니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-02
  decision: 각 투입은 오늘과 투입일 중 늦은 날을 적용일로 삼고, 변경 불가·동시 수정 충돌 건은 이유와 함께 제외한 뒤 가능한 건만 반영합니다.
    현재 값과 같은 건은 건너뛰며, 소급 적용은 일괄 작업에서 제공하지 않고 개별 변경으로 처리합니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-03
  decision: 교체일 기준 단가로 새 투입을 시작하고, 기존 투입에 등록된 교체일 이후의 예정 단가 변경도 남은 투입 기간에 한해 승계합니다.
    교체 사실과 승계 범위는 교체 기록에서 확인할 수 있게 합니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-04
  decision: 일반 투입을 대체투입으로 바꿀 때는 계약상 인력을 필수로 지정하고, 일반 대체투입을 다른 구분으로 바꿀 때는 계약상 인력을 해제합니다.
    교체로 생성된 투입은 계약상 인력 연결을 유지하기 위해 대체투입 구분과 계약상 인력을 변경할 수 없게 합니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-05
  decision: 마감 당시의 단가와 금액은 유지하고, 소급 변경의 요청 내용은 변경 이력에 남기며 변경 단가는 최초 미마감 월부터 적용합니다.
    그 전에 투입이 끝났다면 변경 사실만 기록하고 금액에는 반영하지 않습니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-06
  decision: 실제 투입 일정이 늘거나 줄어든 경우는 연장 또는 조기 철수로 기록하고, 기간·투입 구분 변경은 최초 입력 오류를 바로잡는 용도로
    제한합니다. 종료일을 바로잡는 경우 사유를 필수로 남기며, 파견 기간과 마감 보호 등 공통 검증은 동일하게 적용합니다.
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
- id: OQ-ASGN-07
  decision: '과거·마감 기간에 걸친 신규 배정의 자동 START 기록에도 사유를 필수로 남긴다. 배정 폼과 B.5 업로드 양식에 사유 코드(rsn_cd,
    ASGN_CHG_RSN)와 사유 설명(rsn_desc, 선택·최대 200자) 입력을 추가하고 API·행 검증·양식 내려받기에 동일하게 반영한다.
    기존 업로드 출처 설명(엑셀 업로드 #{upldId})은 보존하며 사용자 사유를 대체하지 않는다. 사유 누락 시 필드/행 오류로 안내하고 해당
    배정·MM·단가·START 이력을 기록하지 않는다. 마감월 MM·단가 효과는 기존 확정값을 유지한다.'
  confirmed_by: mjung
  confirmed_at: '2026-10-27T03:55:43.538164+00:00'
