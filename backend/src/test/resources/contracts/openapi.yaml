      - 확인할 일의 개별 MM 초과·선투입 등 별도 월 규칙이 있는 항목은 그 원천 규칙을 보존하고 sourceMonth에 적용 월을 명시한다. 지난달 청구 누락은 오늘 직전 월 또는 원천의 마지막 CLOSED 검증가능 월, 최초구축 전 월은 마감 대상 확인 필요.
      - 모든 업무 데이터 조회는 DB 읽기 전용이다. export의 기존 다운로드 감사만 기존 규칙에 따라1건 기록하며 새 감사 저장소를 만들지 않는다. 알림 DB 저장·발송·마감 점검 실행·확정·청구·가배정·견적 승인 호출 금지.
