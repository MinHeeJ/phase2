openapi: 3.0.3
info:
  title: SI 프로젝트·원가 관리 기반 및 공통코드 HTTP 계약
  version: 기반-1
  description: SPEC-REQUEST.md 전체 352행과 승인 spec.md·plan.md·tasks.md·원장 129개의 설계 투영.
    모든 API는 인증 없이 호출한다. 업무 동작은 원장 의미를 보존한다. 원문 명시 METHOD/path는 유지하며 미지정 관리 자원 경로/operationId는
    x-design-decision의 승인 보류 제안이다. OQ-001 영속성 충돌, OQ-002 SQL 부재, OQ-004 이력 세부, OQ-005
    봉투와 OQ-010 입력/성공 세부가 미해결이므로 build-ready가 아니다. 생성 완료는 구현·실행·사용자 승인이 아니다.
security: []
paths:
  /api/dashboard:
    get:
      operationId: getDashboard
      summary: 기준월 대시보드 통합 조회
      description: 기존 동일 목적 통합 API가 없어 신규 GET을 추가한다. 업무 계산은 기존③~⑬ 읽기 서비스에 위임하며 단일 DTO로 조합한다. 인증 없이 접근한다.
      security: []
      x-related-requirements:
      - REQ-610
      - REQ-611
      - REQ-612
      - REQ-614
      - REQ-617
      - REQ-619
      - REQ-621
      - REQ-623
      - REQ-624
      - REQ-625
      - REQ-627
      - REQ-629
      - REQ-633
      x-permission-key: UI-16.read
      x-permission-enforcement: ⑯ 전 미적용. 로그인·역할별 필터·위젯 숨김·실제 차단 없음.
      x-sensitive:
      - 원가
      - 이익
      - 금액
      - 잔액
      - 개인 정보
      x-pagination-exemption: DEC-1702의 기준월 단일 대시보드 문서이며 자원 컬렉션 목록 API가 아니다. month로 M을 필터링하고 내부 추이는12개월·인력6개월·현금3개월·기회최대3건/전체수로 제한한다. 카드별 페이지 분할은 동일기준 비교를 깨므로 page/size/search를 추가하지 않는다.
      x-business-rules:
      - CMN-1701 | 기준월 M=사용자 선택 또는 기본 현재 월(Asia/Seoul, 서버 Clock). '이번 달'은 M을 의미. YTD=조회 연도 1월부터 M까지(미래 값 제외). '앞으로 3/6개월'은 **실제 오늘의 다음 달부터** 각각 3/6개월로 고정해 예측 화면과 동일한 시점으로 비교한다; 과거 기준월을 선택해도 전망 영역에 `오늘 기준 예측` 표시. 과거 월 상세·KPI는 기준월 M으로, 예측은 오늘로 분리한다.
      - CMN-1702 | CLOSED 월 수치=⑫ 확정 fin.mth_pl/cst.cst_aloc 및 해당 스냅샷; OPEN 월은 ⑨~⑪ 원천 실시간 집계. 마감 월이라도 뒤늦은 자료를 재계산해 스냅샷 값을 바꾸지 않는다. 과거 확정 월 스냅샷 누락은 임의 0 표시하지 않고 `마감 자료 확인 필요`, 점검 링크. 데이터 없음과 실제 0은 구분한다.
      - CMN-1703 | 금액은 원 정수 집계 후 표시만 사용자가 선택한 단위로 변환(원/천 원/백만 원 등 기존 공통), 비교 계산은 원본 정수. 비율 퍼센트는 소수 첫째 HALF_UP, 기회 확률 등 기존 화면이 둘째 자리 사용하는 값은 해당 서비스 반환 자릿수 유지. %p와 % 구분, 분모 0은 `–`, 불명확한 값은 `자료 없음`. `전월 대비` = (M−M-1)/abs(M-1)×100(전월 0이면 `–`), 양/음·0% 표시. 손익액이 음수인 전월의 비율은 절댓값 분모와 함께 `참고 증감률`로 표시.
      - CMN-1704 | 대시보드는 조회 전용. 새로고침·재진입 시 원천 재조회, 서버 응답 기준 시각 표시. 별도 정기 백그라운드 배치/스냅샷 생성 금지; 저장 직후 해당 업무 화면에서 돌아오면 신규 집계를 보여준다. 단일 응답 내 동일 `asOf` Clock·선택 M 유지, UI에서 각 카드별로 서로 다른 월을 조합하지 않는다. 응답 지연 시 카드 스켈레톤, 부분 실패 시 다른 카드는 표시하고 실패 카드에 `다시 조회`(기존 읽기 재시도, 자동 쓰기 금지).
      - CMN-1711 | 월 매출=⑨ BillingRevenueQuery의 M월 귀속 CONFIRM 순공급가액(TK 청구월, MO/DP 귀속월, IN=0, 수정청구/취소 반영). 월 영업이익·이익률=⑪ MonthlyProfitService의 M월 값(⑫ 영업외손익 전월 조정은 영업이익에서 제외). 매출이 0이면 영업이익률 `–`. 원가·판관비·파트 정산을 대시보드에서 다시 산식 구현하거나 재차 차감하지 않는다.
      - CMN-1712 | 이번 달 매출 목표 = ⑪ UI-18 사업계획의 M월 매출 목표, 달성률=실적/목표×100(목표 0/없으면 `–`). 월 매출·영업이익 전월 대비는 CMN-1703과 동일. 이전 달이 속한 연도가 달라도 해당 전월 자료 조회, 없으면 비교 `–`로 표시.
      - CMN-1713 | 누계 영업이익=선택 연도의 1~M월 MonthlyProfitService 합(확정+미마감 구분 유지). 목표 달성률=같은 기간 사업계획 영업이익 목표 합계 기준, 분모 0이면 `–`; 목표 미등록은 `목표 없음`, 실적 0과 구별. 집계 시 ⑫ IMPORT/CLOSE 같은 달 이중 합산 금지.
      - CMN-1714 | 월 가동률=⑬ WorkforceForecastService/UI-28과 동일한 **확정 투입 MM 합 / 근무 가능 직접 인력 MM 합×100**(중복 인력·가배정 제외, 분모 0이면 `–`). 목표 90%(기존 운영 기준 있으면 해당 값), 목표 대비 %p. 대기 인원=⑬ UI-28 '비는 인원' 정의에 따른 확정 투입 0·휴직 아닌 직접 인력의 해당 월 인원(퇴사자 제외). 영업 파트간 중복 합산 금지.
      - CMN-1715 | 미수금=⑨ 확정 청구 총액(VAT 포함)−실수납 및 유효 수정청구 상계한 미수 잔액의 합(0 미만 제외). 기준일 오늘까지 확정된 청구 대상으로 하며 연체 여부와 연체 금액은 ⑨ 미수 알림 서비스의 동일 판정(예정일<오늘, 미수>0), 청구 건별 1회. M 선택이 과거라도 미수 카드에는 `오늘 현재` 표시(과거 잔액을 복원하지 않음).
      - 'CMN-1721 | 알림 행은 종류별 1행(영향 대상 n건/n명 함께 표시), DB에 알림을 저장하거나 발송하지 않는다. 순서 고정: (1) 연체 미수 (2) 3개월 내 자금 부족 (3) 6개월 내 인력 부족 (4) 위험 프로젝트 (5) MM 1.0 초과 (6) 미계약 선투입 (7) 3개월 안 철수 (8) 영업 파트 미지정 (9) 기한 지난 이슈 (10) 14일 초과 업데이트 없음 (11) 지난달 청구 누락 (12) 견적 승인 대기 (13) 미마감 지난달 (14) 장기 미갱신 기회 (15) 저마진/적자 인력·저마진 턴키 (16) 확정 전 추가 계약. 0건인 유형 숨김, 정보 미조회 유형은 0건 처리하지 않고 `판정 불가` 안내.'
      - CMN-1722 | 심각도 `급함`=연체·자금 부족·인력 부족·⑥ 위험 프로젝트, 그 외 `주의`. 총 `n건`은 **표시된 종류의 행 수**, 개별 항목의 인원/건수 합이 아님; 급함 수 역시 행 수. 동일 프로젝트가 위험 프로젝트와 이슈 행에 동시에 표시되는 것은 종류가 달라 허용하지만 유형 내부에서는 prj_id/asgn_id/dev_id 등 원천키로 중복 제거. 프런트에서 독자 임계값 새로 정의 금지.
      - CMN-1723 | 연체/미수→UI-13, 자금 부족→UI-21, 인력 부족→UI-17, 위험 프로젝트·기한 지난 이슈·갱신 지연→UI-31, MM 초과·선투입→UI-12, 철수→UI-05, 파트 미지정→UI-01, 청구 누락→UI-13 누락 점검, 견적 승인/기회 미갱신→UI-29, 저마진/적자→UI-04 또는 UI-32, 추가 계약→UI-01, 마감 미완료→UI-14. 기존 라우터/상세 창 이동 인터페이스 사용, 필터 전달이 가능하면 대상 ID·기준월 포함; 미지원 필터를 무시한 채 다른 화면에 간 것처럼 표시하지 않는다.
      - CMN-1724 | ⑧ 철수 리스트의 `다음 배정 없는 n명 중 m명은 추천 자리 있음`을 ⑬ 규칙 기반 추천으로 계산한다. n=⑧ CMN-1207 대상 고유 개발자 수, m=이 중 점수 유효 추천 자리 최소 1개인 사람 수; m≤n 보장. LLM 호출 없음. MM 초과는 ⑦ 월 전체 확정 투입으로 dev_id 중복 제거; 선투입은 해당 월 실제 유효 투입을 asgn_id 기준 건수 표기.
      - CMN-1725 | 프로젝트 경보 대상=⑥ UI-31 진행 대상 중 ⑩ UI-04 저마진/예산 초과 또는 ⑥ 신호등 위험·주의. 동일 프로젝트 한 줄, 가장 심한 수준 먼저, 수준 동률이면 (예산 소진율 높은 순→prj_id 오름차순). `주원인`은 ⑩ 원가 초과 원인 서비스의 최대 금액 원인 1개(동률 원천 ID 오름차순), 원인 없음은 `분석 자료 없음`. TK는 예상 최종 마진율, MO/DP는 해당 월 마진율. 원가 미등록은 0원·100% 마진으로 오판하지 않고 자료 부족 경고. 상세 이동 시 UI-04 프로젝트 상세 [원가 초과 원인]을 기존 호출로 열기.
      - CMN-1726 | ⑫ 9종 CLOSE_CHECK 각각 최신 조회 결과 상태 OK/WARN/FAIL과 issue_cnt 사용. 완료 수=OK 개수, 전체=항상 9; WARN/FAIL은 미완료 목록. 월 CLOSED면 `마감 완료` 및 `9항목 점검 이력` 표시하되 확정 당시 점검 스냅샷 사용. OPEN인데 점검 결과 없다면 `점검 전 · 0/9`, 0/9를 점검 실패 9건으로 표시하지 않는다. 미완료 행 클릭→UI-14 또는 연계 원천 화면.
      - CMN-1727 | `지난달 청구 누락` = ⑨ BillingGapService의 현재 달 직전 월(또는 원본 규칙의 마지막 마감월 조회가 필요하면 마지막 CLOSED 월) 중 검증 가능 최신 월; 사용한 월 명시. ⑬ 견적 승인 대기=PENDING인 OPEN 기회, 종료 제외. 미마감 지난달=오늘 기준 직전 달 fin.mth_cls≠CLOSED; 해당 월이 최초 구축 범위 이전이라 원천이 없는 경우 `마감 대상 확인 필요`로 별도 표기.
      - 'CMN-1731 | 매출·원가 추이는 선택 연도 1~12월: 매출=⑨/⑪ 월 귀속 확정 공급가, 원가=⑪ 매출원가(직접 인건비+대기 비용+직접 경비; 판관비 별도), 목표 매출=⑪ UI-18 월별 사업계획 목표. 조회 기준월 이후 **실적 포인트는 null**(0과 구분), 계획은 연도 12개월 표시. CLOSED 원가/매출은 ⑫ 확정값 우선. 차트와 보조 표에서 금액 일치(원 단위 비교).'
      - 'CMN-1732 | 6개월 인력 차트=⑬ `WorkforceForecastService`에서 오늘 다음 달부터 6개월을 한번에 조회. 가용 공급·확률 반영 수요는 직무·등급 결과를 월별 MM로 합산(사람 수로 단순 세지 않음), 부족=수요−공급>0.40 MM인 월(⑬ 기준 그대로). 예: 공급 2.0/수요 2.5면 0.5 MM 부족; 2.0/2.4면 임계 초과가 아니므로 경고 없음. 수요에 가배정 중복 가산 금지. 표·차트 같은 소수 표시 규칙 적용.'
      - CMN-1733 | 영업 파트별 월 매출은 프로젝트의 M월 유효 파트 귀속 이력(⑤ prj_part_hist)을 기준으로 ⑨ 확정 공급가액을 집계, 본사는 별도 한 줄. 영업 파트별 이익률은 ⑩ UI-19의 동일 월 정산/이익 산식과 동일한 정의를 명칭에 표시(`파트 이익률`); ⑪ 회사 영업이익률을 매출만 파트별로 나눈 값으로 재계산하지 않는다. 해당 파트 수익이 0이면 `–`, 부속 원가 자료 없으면 `산정 불가`. 월별 확정 파트 정산을 수정하지 않는다.
      - CMN-1734 | 영업 파이프라인은 ⑬ UI-29 OPEN 기회만 집계, `확률 반영 예상 매출`=Σ(기회 예상금액×저장된 개별 확률/100), 각 기회 연금액 원 단위 버림 후 합산(⑬의 매출 전망 서비스 원칙과 동일). 3개월 내 시작 기회=오늘 다음 달~3개월 말일까지 시작 또는 현재 진행 중·시작 예정인 OPEN 기회, 시작월→확률 내림차순→oppt_id 오름차순, 화면에는 3건까지 표시, 전체 수는 별도 표시. 견적 산출 매출이 기회 예상금액과 달라도 전망은 **기회 예상금액**을 쓴다.
      - CMN-1735 | 자금 전망은 ⑪ UI-21의 오늘 다음 달부터 3개월 **예상 최종 잔액**(완료 실제 거래 + 미완료 예정 거래) 조회 재사용. 단순 예정 잔액/실적 잔액을 섞지 않음. 동일 원본 ID의 부분 입금·지급은 실적만큼 예정 잔여를 줄이고, 연결 없는 실제 거래는 독립적으로 반영. 법인세 현금 실적은 ⑫ 확정한 fin.pay PAID 원천 한 번만. 최소 운영자금 기준은 ⑪ 자금 기준값(기존 cmn.oprt_std) 사용, 잔액<기준인 월만 위험(같으면 정상). 시작 잔액·기준값 결손은 `자료 부족`으로 표시, 부족 0건으로 오판하지 않는다.
      - CMN-1736 | 부가세 제외 손익(매출·원가·영업이익)과 부가세 포함 미수·현금은 명확히 라벨을 구분한다. 미래 예측·시나리오 금액에는 `예상` 표시, 확정 월 실적·오늘 현재 미수·미래 전망 값 혼합 시 각 기준을 표기한다. 차트/카드 수치는 설명 없이 예측치를 확정치로 바꾸지 않는다.
      - 'DEC-1701 | DB 읽기 전용: fin.mth_cls/mth_cls_hist/cls_chk/mth_pl/biz_plan/cash_bal/part_stlm, bill.bill/rcpt, cst.cst_aloc, prj.prj/prj_part_hist/issue, asgn.asgn/asgn_mth, mst.dev/dev_work_stts_hist/bsn_part, bsn.oppt/quot_aprv_hist, cmn.oprt_std 및 선행 서비스가 사용하는 관계를 참조한다. SQL 원본의 실제 테이블·컬럼명과 기존 JPA 매핑 사용. 새로운 저장·DDL·시드 생성 불필요.'
      - 'DEC-1702 | `GET /api/dashboard?month=YYYY-MM` (없으면 현재 월): 응답 `asOf`, `basisMonth`, `lastClosedMonth`, `closeStatus`, `kpis`, `actions`, `closeProgress`, `projectAlerts`, `revenueCostTrend`, `workforceForecast`, `partSummary`, `pipeline`, `cashForecast`, `warnings`. 업무 계산은 기존 서비스 호출, DashboardQueryService는 조회 결과 조합·정렬·표시 메타만 담당. 프런트는 서버 DTO 데이터로만 렌더링. 기존 동일 목적 API 있으면 중복 경로 생성 대신 확장한다.'
      - DEC-1703 | 상세 이동은 기존 앱 라우터/탭 핸들러로 UI-08·18·28·13·14·04·17·21·29·31·12·05·01·32에 연결. 없는 페이지 새로 스캐폴딩 생성 금지(선행 구현 문제는 오류 표기). URL/쿼리 상태로 대상 id·month 전달 가능한 범위에서 전달하고 상세에선 해당 대상이 보이게 한다.
      - DEC-1704 | 권한 식별자 `UI-16.read`, `UI-16.download`와 서브 민감 데이터 `@Sensitive`(원가·이익·금액·잔액·개인 정보). ⑯ 활성화 전 권한 검사/로그인/역할별 필터는 도입하지 않는다. ⑯ 후 사용자별 허용 위젯만 반환할 수 있도록 응답 조합부에 권한 자리만 준비한다. 클라이언트 숨김만으로 실제 접근 제어를 구현한 것으로 간주하지 않는다.
      - DEC-1705 | 엑셀 다운로드는 ③의 `ExcelExportService` 패턴 재사용. 대시보드에서 다운로드 시 기준·생성 시각, KPI/확인할 일/월 마감/경보/12개월 추이/6개월 인력/파트/기회/3개월 자금의 표시 근거를 시트별로 기록(제외 항목은 `조회 불가` 명시), 화면과 수치 동일. @Sensitive 원칙·다운로드 감사는 ③ 기존 규칙 유지.
      - 'DEC-1706 | 읽기 전용 조회는 DB 변경 없음, 임시 수치 생성 없음. 성능: 동일 조회의 월 원천을 미리 일괄 조회하고 N+1 방지, 관계 없는 위젯 간 부분 실패 격리. 안정적으로 동일 `asOf`를 반환, 열려 있는 월의 조회 중 원천 변경 가능성은 스냅샷 완전 일치를 보장하지 않으므로 프런트에서 기준시각 명시. 개발 환경 성능 목표: 시드 1,000개 프로젝트/3,000명/12개월 가상 데이터 기준 일반 응답 p95≤3초(동일 환경 측정, 테스트 데이터는 운영 DB에 저장 금지); 실환경 SLA는 별도 협의.'
      - DEC-1707 | 기존 마감/손익/인력예측 서비스에 읽기 인터페이스를 추가한 경우 각 이전 화면의 수치 불변과 회귀 테스트를 의무화. 특히 ⑫의 마지막 마감월·점검 시점 보존, ⑬의 0.40MM 부족 임계값과 전망 기준월, ⑨ 미수 VAT 포함, ⑪ 현금 중복 제거를 변경하지 않는다.
      - 'SPEC-REQUEST.md:172: 별도 기준이 없는 확인할 일과 프로젝트 경보는 오늘 현재의 업무 상태를 보여준다. 선택 M의 KPI·마감·추이·파트와 분리한다.'
      - 'SPEC-REQUEST.md:188 최종 명확화 우선: 이미 시작한 영업 기회는 앞으로 3개월 내 시작 목록에 포함하지 않는다. CMN-1734의 현재 진행 중 포함 문구는 이 목록에 적용하지 않는다. OPEN 전체 집계는 유지한다.'
      - '개발 테스트는 두 GET 모두 security: []이며 UI-16.read/download는 연결 자리다. 로그인·권한 차단·사용자별 위젯 숨김·역할별 필터·401/403을 도입하지 않는다. 기존 bearerAuth 정의는 보존한다.'
      - DashboardQueryService는 기존 서비스의 조회 결과 조합·정렬·표시 메타만 담당한다. 새 집계 계산·DB 테이블·스냅샷·DDL·마이그레이션·더미·백그라운드 배치 생성 금지. 업무 쓰기는 기존 목적지에서만 수행한다.
      - 실제 서비스 정의·타입·경로를 확인하고 같은 목적 읽기를 호출한다. 이름 차이로 두 번째 계산 서비스를 만들지 않는다. 필요 DTO/메서드는 원천 서비스 읽기 인터페이스만 확장하고 호출처·이전 화면 동등성 회귀를 명시한다.
      - 정본에는 getClosing, getMonthlyFinanceProfit, getFinanceCashflow 등 선행 계약은 있으나 동일 목적 대시보드 통합 조회/엑셀은 없다. 저장소에 해당 서비스 구현 정의는 확인되지 않았으므로 아래 이름은 원문 의존성이지 실제 클래스 바인딩 검증 완료 주장이 아니다. 누락된 선행 API/DTO/계산 서비스는 해당 카드 ERROR/MISSING 및 warnings로 드러내고 필수 실제 연결 전 최종 완료 보류.
      - GET 재조회는 정상 카드의 값을 유지하고 실패 카드만 다시 읽도록 클라이언트가 상태를 갱신한다. 원천 하나 실패는 HTTP200 내 해당 카드 ERROR/PARTIAL과 warnings로 격리하며 성공 카드를 통째로 지우지 않는다. month 자체 오류만400, 응답 조합 전체 실패는500. 임의0 대체·자동 쓰기 금지.
