          type: string
          description: 사용자 오류 문구
        field:
          type: string
          nullable: true
          description: 입력 오류의 필드. 배열 내 필드 위치 표현은 OQ-010.
        requestId:
          type: string
          description: X-Request-Id와 연결되는 문의 번호
      required:
      - success
      - meta
      - code
      - message
      - requestId
      description: 'REQ-058·REQ-067: 원문 오류 네 필드는 최상위에 유지하고 success=false/meta를 더한다. ApiResponse 아래 중첩하지 않는다.'
